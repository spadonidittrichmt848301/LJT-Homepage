# Workflow for building and deploying the personal homepage to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Verify publication listings
        run: |
          for page in _site/index.html _site/publications/index.html; do
            grep -q 'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond' "$page"
            grep -q 'On the Perception Bottleneck of VLMs for Chart Understanding' "$page"
            grep -q 'On the Universal Truthfulness Hyperplane Inside LLMs' "$page"
            grep -q 'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation' "$page"
            grep -q 'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models' "$page"
            grep -q 'Composing Parameter-Efficient Modules with Arithmetic Operations' "$page"
          done
          grep -q 'jliugi@connect.ust.hk' _site/index.html
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
        continue-on-error: true
      - name: Check Pages availability
        id: pages_status
        run: echo "enabled=${{ steps.pages.outcome == 'success' }}" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    if: ${{ needs.build.outputs.pages_enabled == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
